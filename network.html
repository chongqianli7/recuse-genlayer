<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Recuse · Studionet verification</title
  ><style>
    body {
      font: 15px system-ui;
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f2eb;
      color: #192324;
    }
    button {
      padding: 14px;
      background: #173fd1;
      color: white;
      border: 0;
      border-radius: 6px;
      margin-right: 14px;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 11px;
      background: white;
      padding: 22px;
    }
    h1 {
      font-weight: 500;
    }
    p {
      line-height: 1.7;
    }
  </style>
  <h1>Recuse / Stable Studionet verification</h1>
  <p>
    Runs a zero-value synthetic committee using three temporary test wallets.
    Test keys remain in this tab's session storage and are never exported. All
    writes use full consensus. Run/resume never repeats a recorded transaction.
  </p>
  <button id="run">Run / resume verification</button
  ><button id="export">Export evidence</button>
  <p id="status" role="status">Ready</p>
  <pre id="report"></pre>
  <script type="module" src="/scripts/network-browser.js"></script>
</html>
